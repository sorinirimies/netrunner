# ──────────────────────────────────────────────────────────────────────────────
# Auto-merge — merge Dependabot PRs (patch, minor AND major) once CI succeeds
# ──────────────────────────────────────────────────────────────────────────────
# No branch protection is needed: this runs after the CI workflow completes and
# only merges when CI concluded successfully.
#
# Requirements: none beyond Actions having write permission (set below).
# ──────────────────────────────────────────────────────────────────────────────

name: Auto-merge Dependabot

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Merge PR (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number,headRefOid \
            --jq ".[] | select(.headRefOid==\"$SHA\") | .number" | head -n1)
          if [ -z "$pr" ]; then echo "No open PR for $BRANCH@$SHA (stale run); skipping."; exit 0; fi
          gh pr review --repo "$REPO" --approve "$pr" || true
          gh pr merge --repo "$REPO" --squash "$pr"
