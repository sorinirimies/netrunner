[package]
name = "netrunner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "netrunner — desktop internet speed-test & network diagnostics app (Zed GPUI) with live download/upload charts"
readme = "README.md"
keywords = ["network", "speed-test", "gui", "gpui", "bandwidth"]
categories = ["gui", "visualization"]

[[bin]]
name = "netrunner"
path = "src/main.rs"

[lib]
name = "netrunner_gui"
path = "src/lib.rs"

# GPUI runs on macOS and Linux: on other systems the binary is a stub that
# points to netrunner_cli and netrunner-web.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
netrunner-core = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
gpui = { workspace = true }

# gpui 0.2.2 reaches xattr 0.2.3 (through zed-async-tar), which uses libc::ENOATTR,
# gone from Linux since libc 0.2.190. The exact requirement holds libc there through
# the nightly cargo update; a lockfile-only hold did not.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"

[package.metadata.cargo-machete]
# libc is only the version hold above; no code uses it.
ignored = ["libc"]

[lints]
workspace = true
