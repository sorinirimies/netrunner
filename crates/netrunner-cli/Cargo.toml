[package]
name = "netrunner_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "A feature-rich Rust-based CLI to test and analyze your internet connection"
readme = "README.md"
keywords = ["cli", "network", "internet", "speed-test", "diagnostics"]
categories = ["command-line-utilities", "network-programming"]
exclude = [
    "examples/vhs/target/*.gif",
    "examples/vhs/",
    "results.json",
]

[[bin]]
name = "netrunner_cli"
path = "src/main.rs"

[lib]
name = "netrunner_cli"
path = "src/lib.rs"

# prettytable-rs is used as `prettytable`, a library name machete does not map.
[package.metadata.cargo-machete]
ignored = ["prettytable-rs"]

[dependencies]
netrunner-core = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
clap = { workspace = true }
indicatif = { workspace = true }
colored = { workspace = true }
console = { workspace = true }
dialoguer = { workspace = true }
ratatui = { workspace = true }
tui-nuances = { workspace = true }
crossterm = { workspace = true }
prettytable-rs = { workspace = true }
tui-piechart = { workspace = true }
tui-chart = { workspace = true }
tui-spinner = { workspace = true }
tui-rating = { workspace = true }
tui-slider = { workspace = true }
tui-checkbox = { workspace = true }
tui-file-explorer = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-test = { workspace = true }
rustls = { workspace = true }

[lints]
workspace = true
