[package]
name = "netrunner-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "netrunner web dashboard — internet speed test streamed live to the browser (Topcoat SSR + server-sent events)"
readme = "README.md"
keywords = ["network", "speed-test", "web", "topcoat", "bandwidth"]
categories = ["web-programming", "visualization"]

[[bin]]
name = "netrunner-web"
path = "src/main.rs"

[lib]
name = "netrunner_web"
path = "src/lib.rs"

[dependencies]
netrunner-core = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
topcoat = { workspace = true }
