# cargo-deny configuration: `cargo deny check`
[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # Pre-existing advisories (transitive via gpui/reqwest/rustls etc.); triage: update deps or remove entries once fixed.
    "RUSTSEC-2023-0089",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0052",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2026-0173",
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0206",
    "RUSTSEC-2026-0258",
    "RUSTSEC-2026-0285",
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0348",
    "RUSTSEC-2026-0349",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    "WTFPL",
    "CC0-1.0",
    "NCSA",          # transitive (libfuzzer-sys style dual license)
    "CDLA-Permissive-2.0",  # webpki-roots
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
