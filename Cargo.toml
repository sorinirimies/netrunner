[workspace]
members = [
    "crates/netrunner-core",
    "crates/netrunner-cli",
    "crates/netrunner-gui",
    "crates/netrunner-web",
]
resolver = "2"

[workspace.package]
version = "2.0.5"
edition = "2024"
rust-version = "1.90"
authors = ["Sorin Albu-Irimies <mihaiirimies@gmail.com>"]
license = "MIT"
homepage = "https://github.com/sorinirimies/netrunner"
repository = "https://github.com/sorinirimies/netrunner"

# ── Shared dependency versions ────────────────────────────────────────────────
# Single source of truth — crates reference these with `{ workspace = true }`.
[workspace.dependencies]
# Core / shared
tokio = { version = "1.50", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
rand = "0.10"
dns-lookup = "3.0"
redb = "4"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
dirs = "6.0"

# TUI (netrunner-cli)
clap = { version = "4.6", features = ["derive"] }
indicatif = "0.18"
colored = "3.0"
console = "0.16"
dialoguer = "0.12"
ratatui = "0.30"
tui-nuances = "0.1.10"
crossterm = "0.29"
prettytable-rs = "0.10"
tui-piechart = { version = "1.4", features = ["theme"] }
tui-chart = { version = "0.6", features = ["theme"] }
tui-spinner = { version = "0.5", features = ["theme"] }
tui-rating = { version = "0.4", features = ["theme"] }
tui-slider = { version = "0.4", features = ["theme"] }
tui-checkbox = { version = "0.5", features = ["theme"] }
tui-file-explorer = { version = "4", default-features = false }

# GUI (netrunner-gui)
gpui = "0.2"

# Web (netrunner-web)
topcoat = { version = "0.10", features = ["sse"] }

# Internal crates
netrunner-core = { path = "crates/netrunner-core", version = "2.0.5" }

# Dev
tempfile = "3.8"
tokio-test = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
# `pub` only for what another crate uses; then dead_code finds the rest.
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
opt-level = 0

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
