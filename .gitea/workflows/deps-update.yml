name: Nightly Dependency Upgrade

on:
  schedule:
    # Runs at 02:30 UTC every day (03:30 CET)
    # Offset 30 min from GitHub to avoid simultaneous runs.
    - cron: "30 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: deps-update
  cancel-in-progress: true

jobs:
  upgrade-deps:
    name: Upgrade Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITEA_TOKEN || github.token }}
          fetch-depth: 0

      # ── Rust toolchain ────────────────────────────────────────────────────────
      - name: Install Rust stable (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # ── cargo-edit (provides `cargo upgrade`) ────────────────────────────────
      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      # ── Upgrade all dependency pins ──────────────────────────────────────────
      # `cargo upgrade --incompatible allow` rewrites version constraints in
      # [dependencies] so pinned libs like `clap = "4.6"` can advance to "5.0",
      # `tokio = "1.50"` to "2.0", etc.
      # `cargo update` then resolves the new constraints into Cargo.lock.
      # Snapshot dependency requirements as data: a patch release is cut ONLY when
      # `cargo upgrade` really changed one (it also reformats manifests, which must not count).
      - name: Snapshot dependency requirements (before)
        run: cargo metadata --no-deps --format-version 1 | jq -S -c '[.packages[].dependencies[] | {name,req,kind,features,optional,target,uses_default_features}] | sort_by(.name,.kind,.target)' > "$RUNNER_TEMP/reqs-before.json"

      - name: Upgrade dependency pins
        run: cargo upgrade --incompatible allow

      - name: Sync Cargo.lock
        run: cargo update

      # ── Check for changes ────────────────────────────────────────────────────
      - name: Check for changes
        id: check
        run: |
          if git diff --quiet Cargo.lock; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for dependency requirement changes
        id: reqs
        run: |
          cargo metadata --no-deps --format-version 1 | jq -S -c '[.packages[].dependencies[] | {name,req,kind,features,optional,target,uses_default_features}] | sort_by(.name,.kind,.target)' > "$RUNNER_TEMP/reqs-after.json"
          if cmp -s "$RUNNER_TEMP/reqs-before.json" "$RUNNER_TEMP/reqs-after.json"; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            # Lock-only: drop cosmetic manifest reformatting from cargo-edit.
            git ls-files -m -- '*Cargo.toml' | xargs -r git checkout --
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Cargo.toml dependency requirements changed -> patch release."
          fi

      # ── Quality gate ─────────────────────────────────────────────────────────
      - name: Check formatting
        if: steps.check.outputs.has_changes == 'true'
        run: cargo fmt -- --check

      - name: Run clippy
        if: steps.check.outputs.has_changes == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings -A deprecated

      - name: Run tests
        if: steps.check.outputs.has_changes == 'true'
        run: cargo test --all-features --all-targets

      # ── Push upgrade branch ──────────────────────────────────────────────────
      - name: Push upgrade branch
        if: steps.check.outputs.has_changes == 'true'
        run: |
          BRANCH="deps/nightly-dependency-upgrade"
          DATE=$(date -u '+%Y-%m-%d')

          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.gitea"

          # Force-create or update the branch
          git checkout -B "$BRANCH"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(deps): nightly dependency upgrade $DATE"
          git push --force origin "$BRANCH"

          echo "✅ Branch '$BRANCH' pushed."

      # ── Create PR via Gitea API + auto-merge ─────────────────────────────────
      # The full quality gate already passed above, so merging is safe.
      - name: Create and auto-merge Pull Request
        id: merge-pr
        if: steps.check.outputs.has_changes == 'true'
        run: |
          BRANCH="deps/nightly-dependency-upgrade"
          DATE=$(date -u '+%Y-%m-%d')
          GITEA_URL="${GITHUB_SERVER_URL}"
          REPO="${GITHUB_REPOSITORY}"
          API="${GITEA_URL}/api/v1"

          # ── Create the PR ────────────────────────────────────────────────────
          echo "Creating PR on ${REPO}..."
          PR_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            "${API}/repos/${REPO}/pulls" \
            -d "{
              \"title\": \"chore(deps): nightly dependency upgrade ${DATE}\",
              \"head\": \"${BRANCH}\",
              \"base\": \"main\",
              \"body\": \"## Automated Nightly Dependency Upgrade\n\nAll quality checks passed: **fmt**, **clippy**, **tests**.\n\nCreated by the Nightly Dependency Upgrade workflow.\"
            }")

          PR_NUMBER=$(echo "$PR_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('number',''))" 2>/dev/null || true)

          if [ -z "$PR_NUMBER" ]; then
            echo "⚠️  Could not create PR (branch may already have an open PR)."
            # Try to find the existing open PR for this branch
            PR_NUMBER=$(curl -s \
              -H "Authorization: token ${GITEA_TOKEN}" \
              "${API}/repos/${REPO}/pulls?state=open&head=${BRANCH}" \
              | python3 -c "import sys,json; prs=json.load(sys.stdin); print(prs[0]['number'] if prs else '')" 2>/dev/null || true)
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "❌ Could not create or find PR. Skipping auto-merge."
            exit 0
          fi

          echo "✅ PR #${PR_NUMBER} ready."

          # ── Merge the PR ─────────────────────────────────────────────────────
          echo "Merging PR #${PR_NUMBER}..."
          curl -s -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            "${API}/repos/${REPO}/pulls/${PR_NUMBER}/merge" \
            -d "{
              \"Do\": \"merge\",
              \"delete_branch_after_merge\": true
            }"

          # Gitea answers 204 on this endpoint once the PR is merged.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: token ${GITEA_TOKEN}" \
            "${API}/repos/${REPO}/pulls/${PR_NUMBER}/merge")
          if [ "$CODE" != "204" ]; then
            echo "PR #${PR_NUMBER} is not merged (HTTP ${CODE}) - no release cut." >&2
            exit 1
          fi
          echo "✅ PR #${PR_NUMBER} merged and branch deleted."
          echo "merged=true" >> "$GITHUB_OUTPUT"
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN || github.token }}

      # ── Patch release: ONLY when a Cargo.toml dependency requirement changed ─────
      # A lockfile-only upgrade was merged above WITHOUT a version bump.
      - name: Install nushell
        if: steps.merge-pr.outputs.merged == 'true' && steps.reqs.outputs.release == 'true'
        uses: hustcer/setup-nu@v3
        with:
          version: "0.111.0"

      - name: Install git-cliff
        if: steps.merge-pr.outputs.merged == 'true' && steps.reqs.outputs.release == 'true'
        run: command -v git-cliff >/dev/null || cargo install git-cliff --locked

      - name: Bump patch version, tag and push
        if: steps.merge-pr.outputs.merged == 'true' && steps.reqs.outputs.release == 'true'
        run: |
          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.gitea"
          git fetch origin main
          git checkout -B main origin/main
          current=$(nu scripts/version.nu)
          IFS='.' read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          while git rev-parse -q --verify "refs/tags/v$next" >/dev/null; do
            patch=$((patch + 1))
            next="$major.$minor.$((patch + 1))"
          done
          echo "Releasing $current -> $next"
          nu scripts/bump_version.nu --yes --skip-checks "$next"
          git push origin HEAD:main
          git push origin "v$next"


      - name: Nothing to update
        if: steps.check.outputs.has_changes == 'false'
        run: echo "✅ All dependencies already up to date — nothing to upgrade."
